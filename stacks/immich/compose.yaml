name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    ports:
      - "${IMMICH_BIND:-127.0.0.1}:${IMMICH_PORT:-2283}:2283"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - type: bind
        source: ${UPLOAD_LOCATION:-./runtime/library}
        target: /data
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    volumes:
      - model-cache:/cache
    restart: unless-stopped

  redis:
    image: valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - type: bind
        source: ${DB_DATA_LOCATION:-./runtime/postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    shm_size: 128mb
    restart: unless-stopped

volumes:
  model-cache:
