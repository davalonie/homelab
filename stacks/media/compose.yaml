name: media

x-linuxserver-env: &linuxserver-env
  PUID: ${MEDIA_UID:-1000}
  PGID: ${MEDIA_GID:-1000}
  TZ: ${TZ:-Europe/Madrid}
  UMASK: "002"

x-data: &data
  type: bind
  source: ${MEDIA_DATA_DIR:-./runtime/data}
  target: /data
  bind:
    create_host_path: false

x-http-health: &http-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 45s

services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    user: "${MEDIA_UID:-1000}:${MEDIA_GID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${MEDIA_BIND:-127.0.0.1}:8096:8096"
    volumes:
      - ${MEDIA_CONFIG_DIR:-./runtime/config}/jellyfin:/config
      - ${MEDIA_CACHE_DIR:-./runtime/cache}/jellyfin:/cache
      - type: bind
        source: ${MEDIA_DATA_DIR:-./runtime/data}/library
        target: /data/library
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    init: true
    environment:
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${MEDIA_BIND:-127.0.0.1}:5055:5055"
    volumes:
      - ${MEDIA_CONFIG_DIR:-./runtime/config}/seerr:/app/config
    healthcheck:
      <<: *http-health
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5055/api/v1/settings/public"]
    restart: unless-stopped

  radarr:
    image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ${MEDIA_CONFIG_DIR:-./runtime/config}/radarr:/config
      - *data
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/ping"]
    restart: unless-stopped

  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls6@sha256:339814bbf50599ac3b59077c252f29833d0138b59a062d0e82ce37bdc7f04f86
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ${MEDIA_CONFIG_DIR:-./runtime/config}/sonarr:/config
      - *data
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/ping"]
    restart: unless-stopped

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:3.1.0.5799-ls170@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - ${MEDIA_CONFIG_DIR:-./runtime/config}/prowlarr:/config
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    profiles: ["flaresolverr"]
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=3).close()"]
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${MEDIA_WG_FILE:-./secrets/wg0.conf}
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.3.1_v2.1.3-ls490@sha256:1fa2f9692501f27ce51c4fffd771d63ec38f1163cb648941c324344b7c5a3915
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: "8080"
    volumes:
      - ${MEDIA_CONFIG_DIR:-./runtime/config}/qbittorrent:/config
      - type: bind
        source: ${MEDIA_DATA_DIR:-./runtime/data}/torrents
        target: /data/torrents
        bind:
          create_host_path: false
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
    restart: unless-stopped

  bazarr:
    image: ghcr.io/linuxserver/bazarr:v1.6.2-ls374@sha256:b3db4247d3afa0c68bc5aa311bedd67b1caf4b3eabc3a85577682970435d5013
    environment: *linuxserver-env
    ports:
      - "127.0.0.1:6767:6767"
    volumes:
      - ${MEDIA_CONFIG_DIR:-./runtime/config}/bazarr:/config
      - type: bind
        source: ${MEDIA_DATA_DIR:-./runtime/data}/library
        target: /data/library
        bind:
          create_host_path: false
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6767/"]
    restart: unless-stopped
